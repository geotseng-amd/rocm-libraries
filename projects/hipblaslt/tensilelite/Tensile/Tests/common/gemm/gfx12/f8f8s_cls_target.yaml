GlobalParameters:
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  # DataInitTypeD: 0
  # DataInitTypeE: 0
  DataInitTypeAlpha: 2
  DataInitTypeBeta: 1
  Architecture: gfx1250
  CpuThreads: 1
  PrintSolutionRejectionReason: True
  # StinkyTofuOptLevel: 3
  ISA: [[12, 5, 0]]
  # For IcacheRotateCopies
  # RotatingBufferSize: 512   # MB; 0 = disabled (default)
  # IcacheRotateCopies: 1000
  # SyncsPerBenchmark must be >= 1: flush_icache kernel is only launched
  # inside the benchmark sync loop (client/main.cpp), not during warmups.
  SyncsPerBenchmark: 1
  NumBenchmarks : 1
  NumWarmups: 0
  EnqueuesPerSync: 1
  # NumWarmups: 1000
  # EnqueuesPerSync: 1000

BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: f8
      DestDataType: f8
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 64, 1,  1, 8, 8,  2, 2]
          # - [16, 16, 32, 1,  1, 8, 8,  1, 1]
          # - [16, 16, 32, 1, 1, 1, 1, 1, 1]
          # - [16, 16, 32, 1, 1, 1, 1, 2, 2]
        - DepthU: [256]
        - TransposeLDS: [-1]
        - LDSTrInst: [False]
        - TDMInst: [3]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMetadata: [0]
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - ClusterLocalRead: [0] # 0 + PLR=0 -> numVgprBuffer=1 (single-buffer A/B input regs) to fit VGPR
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - 1LDSBuffer: [-1]
        - DirectToVgprSparseMetadata: [False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - WavefrontSize: [32]
        # - AssertFree0ElementMultiple: [16]
        # - AssertFree1ElementMultiple: [16]
        # - AssertSummationElementMultiple: [32]
        # for CompactLoopStore
        - CompactLoopStore: [True]
        - NumElementsPerBatchStore: [8]
        - SourceSwap: [False]
        - LDSTrInst: [False]
        # SwInstructionPrefetch bitmask: -1 Auto, 0 Off, 1 Relative, 2 Absolute.
        - SwInstructionPrefetch: [2] # 2 = Absolute (was Prefetch+Abs both True)
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [2048, 1024, 1, 4096]
          # - Exact: [512, 512, 1, 512]
          # - Exact: [64, 64, 1, 512]
          # - Exact: [32, 32, 1, 128]
          # - Exact: [32, 16, 1, 128]
          # - Exact: [16, 16, 1, 512]
          # - Exact: [16, 16, 1, 256]
          # - Exact: [16, 16, 1, 128]
