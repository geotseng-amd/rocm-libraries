GlobalParameters:
  NumElementsToValidate: -1
  KernelTime: True
  BoundsCheck: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  DataInitTypeA: 3
  DataInitTypeB: 3
  # DataInitTypeD: 0
  # DataInitTypeE: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  Architecture: gfx1250
  CpuThreads: 1
  PrintSolutionRejectionReason: True
  # StinkyTofuOptLevel: 3
  ISA: [[12, 5, 0]]
# For IcacheRotateCopies
  # RotatingBufferSize: 512   # MB; 0 = disabled (default)
  # IcacheRotateCopies: -1
  # SyncsPerBenchmark must be >= 1: flush_icache kernel is only launched
  # inside the benchmark sync loop (client/main.cpp), not during warmups.
  SyncsPerBenchmark: 1
  NumBenchmarks : 1
  NumWarmups: 0
  EnqueuesPerSync: 1
  # NumWarmups: 1000
  # EnqueuesPerSync: 1000
  # LibraryFormat: msgpack
BenchmarkProblems:
  #######################################
  # TN - standard
  #######################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: f8
      DestDataType: f8
      ComputeDataType: s
      HighPrecisionAccumulate:  True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      SupportUserArgs: True
      UseBias: 0
      Activation: False
      UseScaleAlphaVec: 0

    - # BenchmarkProblemSizeGroup - Standard
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - UseSgprForGRO: [0] # default is 0
        - ForceDisableShadowInit: [True]
        - MatrixInstruction:
          - [16, 16, 64, 1, 1, 8, 8, 2, 2]
        - DepthU: [256]
        # - PreloadKernArgs: [False]
        - PreloadKernArgs: [True]
        - ClusterDim: [[1, 1]]
        # - ClusterDim: [[4, 4]]
        - ClusterLocalRead: [0] # 0 + PLR=0 -> numVgprBuffer=1 (single-buffer A/B input regs) to fit VGPR
        - TransposeLDS: [-1]
        # - LdsPadA: [0]
        # - LdsPadB: [0]
        # - LdsBlockSizePerPadA: [256]
        # - LdsBlockSizePerPadB: [256]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0] # default is 0
        - StaggerU: [0]
        - ScheduleIterAlg: [4]
        - PrefetchLocalRead: [1] # no LR double-buffer: halves A/B input-reg VGPRs (perf tradeoff)
        - PrefetchGlobalRead: [2]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - 1LDSBuffer: [0]
        - TDMInst: [3]
        - TDMIterateMode: [-1] # default if 0, auto is -1
        - VectorWidthA: [8]
        - VectorWidthB: [-1]
        - DirectToVgprSparseMetadata: [False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - WavefrontSize: [32]
        # --- code-size reduction (problem is 2048x1024x8192, all multiples) ---
        # ASEM caps at 128 (< DepthU=256) so NoTailLoop-via-ASEM is unreachable here.
        # - AssertSummationElementMultiple: [128]
        # AF0/1EM high -> GuaranteeNoPartial: drops the edge-guarded store variants.
        - AssertFree0ElementMultiple: [16] # default is 1
        - AssertFree1ElementMultiple: [16] # default is 1
        # Avoid the LDS store-remap code path.
        - StoreRemapVectorWidth: [0]
        # Do not duplicate the pointer-swap code across the unrolled mainloop.
        - ExpandPointerSwap: [False] # default is True
        # for CompactLoopStore
        - CompactLoopStore: [False] # default is False
        - NumElementsPerBatchStore: [8]
        - SourceSwap: [True] # default is False
        - LDSTrInst: [False] # default is False
        # SwInstructionPrefetch bitmask: -1 Auto, 0 Off, 1 Relative, 2 Absolute.
        - SwInstructionPrefetch: [2] # 2 = Absolute (was Prefetch+Abs both True)
        # - SwInstructionPrefetch: [0] # Off
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          # - Exact: [256, 256, 1, 256]
          # - Exact: [4096, 4096, 1, 1024]
          - Exact: [2048, 1024, 1, 8192]
          # - Exact: [2048, 1024, 1, 4096]